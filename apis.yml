aid: future
name: Future
description: >-
  Future (Future Research, Inc., future.co) is a consumer fitness technology company that delivers
  custom, one-on-one personal training through a mobile app. Members are paired with a dedicated
  certified coach who builds an individualized workout program, provides real-time messaging and
  accountability check-ins, and adapts the plan over time. The product includes an exercise library
  with form-guidance videos, flexible scheduling, and Apple Watch integration for workout tracking.
  Future is a direct-to-consumer subscription service (first month $50, then $199/month with a 30-day
  money-back guarantee) and does not currently publish a public API, developer portal, or OpenAPI. It
  is tracked in the API Evangelist network as a Kleiner Perkins portfolio company.
